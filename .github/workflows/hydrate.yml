name: Hydrate EmbersFort

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hydrate.yml'
      - '.hydrate-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download and verify prepared repository
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://drive.usercontent.google.com/download?id=13FCh0i89iIv5Komx90c2Xk6S1HYe6Ezz&export=download&confirm=t' -o /tmp/embersfort.zip
          test "$(wc -c < /tmp/embersfort.zip)" -eq 1117788
          echo 'e5c3d07c99fe43123866dca12d737a3c2464b48a18667d95f44efb27977ca024  /tmp/embersfort.zip' | sha256sum -c -
          rm -rf /tmp/embersfort-hydrate
          mkdir -p /tmp/embersfort-hydrate
          unzip -q /tmp/embersfort.zip -d /tmp/embersfort-hydrate
          test -f /tmp/embersfort-hydrate/embersfort/AGENT_START_HERE.md
          test -f /tmp/embersfort-hydrate/embersfort/docs/index.html

      - name: Replace bootstrap tree with prepared repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap _transport_probe.txt
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .hydrate-trigger -exec rm -rf {} +
          for item in /tmp/embersfort-hydrate/embersfort/* /tmp/embersfort-hydrate/embersfort/.[!.]* /tmp/embersfort-hydrate/embersfort/..?*; do
            [ -e "$item" ] || continue
            name="$(basename "$item")"
            [ "$name" = '.github' ] && continue
            cp -a "$item" ./
          done

      - name: Commit hydrated repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github' ':!.hydrate-trigger'
          git diff --cached --quiet && exit 0
          git commit -m 'Hydrate EmbersFort repository'
          git push origin HEAD:main
